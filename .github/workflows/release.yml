name: Verify Release Tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify tagged source
        run: npm run verify:release

# Release Please owns changelog/version/tag/GitHub Release creation.
# The repository root is a private monorepo package. Any future npm publication
# must use an explicit package-scoped workflow rather than publishing root.
