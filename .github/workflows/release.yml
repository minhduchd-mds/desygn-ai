name: Verify Release Tag

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify tagged source
        run: npm run verify:release

# Release Please owns changelog/version/tag/GitHub Release creation.
# The repository root is a private monorepo package. Any future npm publication
# must use an explicit package-scoped workflow rather than publishing root.
