name: Source-Policy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-and-repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require source provenance policy
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/SOURCE_PROVENANCE.md

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- \
            ':!package-lock.json' ':!**/package-lock.json' ':!*.min.js'; then
            echo 'Unresolved Git conflict markers found.' >&2
            exit 1
          fi

      - name: Reject committed environment secrets
        shell: bash
        run: |
          set -euo pipefail
          # Example templates such as `.env.example` and `.env.local.example`
          # are documentation, not secret-bearing runtime files.
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo 'Tracked runtime environment files are not allowed:' >&2
            echo "$tracked_env" >&2
            exit 1
          fi

      - name: Policy summary
        run: |
          echo 'Source provenance present.'
          echo 'No unresolved conflict markers found.'
          echo 'No tracked runtime environment secret files found.'
