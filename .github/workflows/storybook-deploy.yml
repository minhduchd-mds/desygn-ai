name: Build Storybook

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "web/src/**"
      - ".storybook/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storybook-deploy.yml"
  workflow_dispatch:

# GitHub Pages is not enabled for this repository. Keep this workflow build-only
# during security cleanup so it needs no deployment/OIDC write permissions.
permissions:
  contents: read

concurrency:
  group: "storybook-build"
  cancel-in-progress: true

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096
