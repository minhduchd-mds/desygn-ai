name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Static Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check generated component registry
        run: npm run registry:check

      - name: Check shared design-system semantics
        run: npm run design-system:check

      - name: Run typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages used by integration tests
        run: |
          npm run build --workspace=@desygn/ui
          npm run build --workspace=@desygn/audit-engine
          npm run build --workspace=@desygn/figma-rest-adapter
          npm run build --workspace=@desygn/report-generator

      - name: Configure deterministic Git identity for repository-fixture tests
        run: |
          git config --global user.name "Desygn CI"
          git config --global user.email "ci@desygn.invalid"

      - name: Run Vitest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm test -- --reporter=verbose 2>&1 | tee test-results/vitest.log

      - name: Run coverage with thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared workspace packages
        run: |
          npm run build --workspace=@desygn/ui
          npm run build --workspace=@desygn/audit-engine
          npm run build --workspace=@desygn/figma-rest-adapter
          npm run build --workspace=@desygn/report-generator

      - name: Build web
        run: npm run web:build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build plugin
        run: npm run build

      - name: Enforce bundle budget
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Bundle sizes ==="
          du -sh public/assets/*.js 2>/dev/null | sort -h || true
          MAIN_SIZE=$(find public/assets -name "index-*.js" -exec du -k {} \; 2>/dev/null | sort -nr | head -1 | awk '{print $1}')
          if [ -z "${MAIN_SIZE}" ]; then
            echo "No main index bundle found under public/assets"
            exit 1
          fi
          echo "Largest main bundle: ${MAIN_SIZE}kB"
          if [ "${MAIN_SIZE}" -gt 600 ]; then
            echo "Bundle budget exceeded: ${MAIN_SIZE}kB > 600kB"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: public/assets/
          retention-days: 7

  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared UI package
        run: npm run build --workspace=@desygn/ui

      - name: Build Storybook
        run: npm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, storybook]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
